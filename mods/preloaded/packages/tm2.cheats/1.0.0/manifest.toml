format_version = 5
id = "tm2.cheats"
version = "1.0.0"
name = "Twisted Metal 2 Cheats"
author = "psxrecomp"
description = "GameShark-style cheat menu for Twisted Metal 2 with overlay UI. Toggle God Mode, Unlimited Energy/Turbo, weapon cheats, and more."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SCUS-94306"

# ---- Player Cheats ----

[[feature]]
id = "god-mode"
name = "God Mode"
description = "Invincibility flag - player cannot take damage"
group = "Player"
default_enabled = false
channel = "developer"

[[feature]]
id = "unlimited-energy"
name = "Unlimited Energy"
description = "Health/energy pool locked at 120 (0x78)"
group = "Player"
default_enabled = false
channel = "developer"

[[feature]]
id = "unlimited-turbo"
name = "Unlimited Turbo"
description = "Turbo meter locked at 200 (0xC8)"
group = "Player"
default_enabled = false
channel = "developer"

[[feature]]
id = "unlimited-advanced-attack"
name = "Unlimited Advanced Attack Energy"
description = "Advanced attack energy locked at 1024 (0x400)"
group = "Player"
default_enabled = false
channel = "developer"

[[feature]]
id = "mega-rapid-fire"
name = "Mega Rapid Fire"
description = "Rapid fire timers zeroed (0x80188B12=0, 0x80188B14=0)"
group = "Player"
default_enabled = false
channel = "developer"

[[feature]]
id = "no-turbo"
name = "No Turbo"
description = "Turbo disabled (0x8018830A=0)"
group = "Player"
default_enabled = false
channel = "developer"

[[feature]]
id = "no-energy"
name = "No Energy"
description = "Energy zeroed (0x80188514=0)"
group = "Player"
default_enabled = false
channel = "developer"

[[feature]]
id = "always-frozen"
name = "Always Frozen"
description = "Freeze flag set (0x801883CC=1)"
group = "Player"
default_enabled = false
channel = "developer"

[[feature]]
id = "never-frozen"
name = "Never Frozen"
description = "Freeze flag cleared (0x801883CC=0)"
group = "Player"
default_enabled = false
channel = "developer"

[[feature]]
id = "disable-left-gun"
name = "Left Gun Disabled"
description = "Left gun disabled (0x80188AF2=0x0F0F)"
group = "Player"
default_enabled = false
channel = "developer"

